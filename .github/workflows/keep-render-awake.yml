name: keep-render-awake

# Render 무료 플랜이 15분 무요청 시 슬립(sleep)에 들어가는 걸 막기 위해 10분마다
# 사이트에 요청을 보낸다. Render 배포 자체는 그대로 두고(재배포 불필요), 이 워크플로만
# 깨어있는 상태를 유지시켜준다. 팀원 공유·제출(8/11)·발표(8/13) 기간을 포함해 지금부터
# 계속 실행한다 — 이 저장소는 퍼블릭이라 GitHub Actions 사용량이 완전 무료라서
# 기간 제한 없이 상시 실행해도 비용 부담이 없다.
# 필요 없어지면 이 파일을 지우거나 저장소 Settings > Actions에서 비활성화하면 된다.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping K-CESS to prevent Render free-tier sleep
        run: curl -sS -o /dev/null -w "K-CESS ping status=%{http_code}\n" https://k-cess.onrender.com/
