name: keep-render-awake

# 8/11 PPT 제출 ~ 8/13 발표 기간 동안 Render 무료 플랜이 15분 무요청 시 슬립(sleep)에
# 들어가는 걸 막기 위해 10분마다 사이트에 요청을 보낸다. Render 배포 자체는 그대로 두고
# (재배포 불필요), 이 워크플로만 깨어있는 상태를 유지시켜준다.
# 평소(발표 기간 외)에는 Actions 사용량을 아끼기 위해 자동 실행을 건너뛰고,
# 수동 실행(workflow_dispatch)은 날짜와 무관하게 항상 핑을 보낸다 (발표 직전 수동 예열용).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check presentation window (KST 8/10~8/14, UTC 기준 여유 포함)
        id: window
        run: |
          today=$(date -u +%Y-%m-%d)
          if [[ "$today" > "2026-08-09" && "$today" < "2026-08-15" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping K-CESS to prevent Render free-tier sleep
        if: steps.window.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: curl -sS -o /dev/null -w "K-CESS ping status=%{http_code}\n" https://k-cess.onrender.com/
