<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;padding:0;background:#E4E9F0;overflow:hidden;font-family:'Noto Sans KR',sans-serif;}
  svg{display:block;width:100%;height:100%;}
  .country{stroke:#FFFFFF;stroke-width:0.75px;}
  .label{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;color:#FFFFFF;font-size:11px;font-weight:700;padding:4px 10px 4px 4px;border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.15);}
  .label.crisis{background:#C0392B;}
  .label.alt{background:#27AE60;}
  .label .dot{width:20px;height:20px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;overflow:hidden;}
  .label .dot img.emoji{width:14px;height:14px;}
  .label .share{font-weight:800;}
  #empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8B93A6;font-size:13px;text-align:center;padding:0 20px;}
</style>
</head>
<body>
<div id="empty">시뮬레이션을 실행하면<br>대체 공급국 지도가 표시됩니다</div>
<div id="labels"></div>
<svg id="map"></svg>
<script>
var svg = d3.select('#map');
var projection = d3.geoNaturalEarth1();
var path = d3.geoPath().projection(projection);
var geoData = null;
var current = { crisis: [], alt: [] };
var COLORS = { crisis: '#C0392B', alt: '#27AE60', none: '#FFFFFF' };

// iframe이 부모 페이지 레이아웃(sticky 사이드바 등)에 자리잡기 전에 스크립트가 먼저
// 실행되면 window.innerWidth/innerHeight가 0으로 읽혀 좌표 계산이 전부 깨지는 문제가
// 있었다 — 매번 새로 읽고, 0이면 합리적인 기본값으로 대체한다.
function getSize() {
  var w = window.innerWidth || document.documentElement.clientWidth || 700;
  var h = window.innerHeight || document.documentElement.clientHeight || 260;
  return { w: w, h: h };
}

function fitAndDraw() {
  if (!geoData) return;
  var size = getSize();
  svg.attr('viewBox', '0 0 ' + size.w + ' ' + size.h);
  projection.fitSize([size.w - 8, size.h - 8], geoData);
  svg.selectAll('path').attr('d', path);
  if (current.crisis.length || current.alt.length) render();
}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
  .then(function(r){ return r.json(); })
  .then(function(topo){
    geoData = topojson.feature(topo, topo.objects.countries);
    svg.selectAll('path').data(geoData.features).enter().append('path')
      .attr('class', 'country').attr('fill', '#FFFFFF');
    fitAndDraw();
  });

window.addEventListener('resize', fitAndDraw);

function infoFor(iso) {
  var c = current.crisis.find(function(d){ return Number(d.iso) === Number(iso); });
  if (c) return { type: 'crisis', data: c };
  var a = current.alt.find(function(d){ return Number(d.iso) === Number(iso); });
  if (a) return { type: 'alt', data: a };
  return null;
}

function render() {
  if (!geoData) return;
  var size = getSize();
  document.getElementById('empty').style.display = 'none';

  svg.selectAll('path').attr('fill', function(d){
    var info = infoFor(d.id);
    return info ? COLORS[info.type] : COLORS.none;
  });

  var labelsEl = document.getElementById('labels');
  labelsEl.style.position = 'absolute';
  labelsEl.style.inset = '0';
  labelsEl.innerHTML = '';
  svg.selectAll('.leaders').remove();
  var leaderLayer = svg.append('g').attr('class', 'leaders');

  var all = current.crisis.map(function(d){ return Object.assign({}, d, { type: 'crisis' }); })
    .concat(current.alt.map(function(d){ return Object.assign({}, d, { type: 'alt' }); }));

  var n = all.length;
  all.forEach(function(item, i){
    var feature = geoData.features.filter(function(f){ return Number(f.id) === Number(item.iso); })[0];
    if (!feature) return;
    var c = path.centroid(feature);
    if (!c || isNaN(c[0]) || isNaN(c[1])) return;
    var angle = (i / Math.max(n, 1)) * Math.PI * 2 - Math.PI / 2;
    var lx = Math.max(70, Math.min(size.w - 70, c[0] + Math.cos(angle) * 110));
    var ly = Math.max(24, Math.min(size.h - 24, c[1] + Math.sin(angle) * 90));

    leaderLayer.append('circle').attr('cx', c[0]).attr('cy', c[1]).attr('r', 3).attr('fill', COLORS[item.type]);
    leaderLayer.append('line')
      .attr('x1', c[0]).attr('y1', c[1]).attr('x2', lx).attr('y2', ly)
      .attr('stroke', COLORS[item.type]).attr('stroke-width', 1).attr('stroke-dasharray', '3,3');

    var div = document.createElement('div');
    div.className = 'label ' + item.type;
    div.style.left = lx + 'px';
    div.style.top = ly + 'px';
    var shareHtml = item.type === 'crisis' ? '<span class="share">위험</span>'
      : (item.share != null ? '<span class="share">' + item.share + '%</span>' : '<span class="share">대안</span>');
    div.innerHTML = '<span class="dot">' + (item.flag || '') + '</span>' + item.name + ' ' + shareHtml;
    labelsEl.appendChild(div);
  });

  if (window.twemoji) twemoji.parse(labelsEl, { folder: 'svg', ext: '.svg' });
  // 부모 페이지(리포트 생성)가 라벨이 실제로 그려질 때까지 기다릴 수 있도록 완료를 알림.
  if (window.parent) window.parent.postMessage({ type: 'altDataRendered' }, '*');
}

window.addEventListener('message', function(e){
  if (e.data && e.data.type === 'setAltData') {
    current = { crisis: e.data.crisis || [], alt: e.data.alt || [] };
    render();
  }
});
</script>
</body>
</html>
