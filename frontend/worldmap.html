<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<!-- Windows(Segoe UI Emoji)는 국기 이모지(regional indicator)를 렌더링하지 못해 빈 칸으로 보이는 문제가
     있어, twemoji로 국기 이모지를 SVG 이미지로 변환해 OS와 무관하게 항상 보이도록 한다. -->
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;padding:0;background:#E4E9F0;overflow:hidden;font-family:'Noto Sans KR',sans-serif;}
  svg{display:block;width:100%;height:100%;}
  .country{stroke:#FFFFFF;stroke-width:0.75px;cursor:default;}
  .country.dep{cursor:pointer;}
  .country.dep:hover{opacity:0.85;}
  .country.kr{stroke:#1B2556;stroke-width:2.5px;}
  .label.kr-label{background:#FFFFFF;color:#1B2556;border:2px solid #1B2556;cursor:default;}
  .label{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:#1B2556;color:#FFFFFF;font-size:12px;font-weight:700;padding:4px 12px 4px 4px;border-radius:999px;white-space:nowrap;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.15);}
  .label .dot{width:22px;height:22px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;overflow:hidden;}
  .label .dot img.emoji{width:16px;height:16px;}
  #tooltip{position:absolute;pointer-events:none;background:#FFFFFF;border:1px solid #DDDDDD;padding:6px 10px;font-size:12px;color:#222222;display:none;white-space:nowrap;}
</style>
</head>
<body>
<div id="tooltip"></div>
<div id="labels"></div>
<svg id="map"></svg>
<script>
// ISO numeric -> dependency profile (수입 의존도 데이터)
var DATA = {
  156: { name: '중국', dependency: 62, minerals: '희토류, 리튬', level: 'high', risk: '경계', flag: '🇨🇳' },
  180: { name: '콩고민주공화국', dependency: 78, minerals: '코발트', level: 'high', risk: '위험', flag: '🇨🇩' },
  152: { name: '칠레', dependency: 45, minerals: '리튬, 구리', level: 'mid', risk: '경계', flag: '🇨🇱' },
  36:  { name: '호주', dependency: 38, minerals: '리튬, 니켈', level: 'mid', risk: '정상', flag: '🇦🇺' },
  608: { name: '필리핀', dependency: 30, minerals: '니켈', level: 'low', risk: '정상', flag: '🇵🇭' },
  360: { name: '인도네시아', dependency: 35, minerals: '니켈', level: 'mid', risk: '정상', flag: '🇮🇩' }
};
var COLORS = { high: '#1B2556', mid: '#3B9AE1', low: '#8FC1EA', none: '#FFFFFF' };
// 한국은 의존도 추적 대상(DATA)이 아니라 "우리나라 위치 표시"용 — 굵은 테두리 + 라벨만
// 별도로 그린다. 클릭해도 국가 상세 패널(수입의존도용)은 띄우지 않는다.
var KOREA_ISO = 410;
var KOREA_LABEL = { name: '대한민국', flag: '🇰🇷' };
var KOREA_OFFSET = [-25, -55];
function fillFor(info) {
  if (!info) return '#FFFFFF';
  if (mode === 'risk' && info.level !== 'high') return '#FFFFFF';
  return COLORS[info.level];
}

var svg = d3.select('#map');
var projection = d3.geoNaturalEarth1();
var path = d3.geoPath().projection(projection);
var tooltip = document.getElementById('tooltip');
var mode = 'all';
var geoData = null;

// iframe이 부모 페이지 레이아웃(로그인 직후 대시보드가 자리잡는 애니메이션 등)에 완전히
// 자리잡기 전에 이 스크립트가 실행되면 window.innerWidth/innerHeight가 0으로 읽혀서
// projection.fitSize에 음수/0 크기가 들어가고, 그 결과 지도가 아예 안 보이거나 모든
// 라벨이 한 점에 겹쳐 보이는 문제가 간헐적으로 있었다 — 매번 새로 읽고 리사이즈에도 대응한다.
function getSize() {
  var w = window.innerWidth || document.documentElement.clientWidth || 700;
  var h = window.innerHeight || document.documentElement.clientHeight || 380;
  return { w: w, h: h };
}

function getInfo(id){ return DATA[String(Number(id))]; }

var OFFSETS = {
  156: [110, -70],   // 중국
  180: [-110, -10],  // 콩고민주공화국
  152: [-90, 50],    // 칠레
  36:  [-10, 90],    // 호주
  608: [70, 40],     // 필리핀
  360: [40, 95]      // 인도네시아
};

function positionLabels(geo, size) {
  var labelsEl = document.getElementById('labels');
  labelsEl.style.position = 'absolute';
  labelsEl.style.inset = '0';
  labelsEl.style.pointerEvents = 'none';
  labelsEl.innerHTML = '';
  svg.selectAll('.leaders').remove();
  var leaderLayer = svg.append('g').attr('class', 'leaders');

  Object.keys(DATA).forEach(function(id){
    var feature = geo.features.filter(function(f){ return Number(f.id) === Number(id); })[0];
    if (!feature) return;
    var info = DATA[id];
    var c = path.centroid(feature);
    if (!c || isNaN(c[0]) || isNaN(c[1])) c = path.bounds(feature).reduce(function(a,b){ return [(a[0]+b[0])/2, (a[1]+b[1])/2]; });
    if (!c || isNaN(c[0])) return;
    var offset = OFFSETS[id] || [80, -60];
    var lx = Math.max(60, Math.min(size.w - 60, c[0] + offset[0]));
    var ly = Math.max(20, Math.min(size.h - 20, c[1] + offset[1]));

    leaderLayer.append('circle').attr('cx', c[0]).attr('cy', c[1]).attr('r', 3).attr('fill', '#1B2556').attr('data-id', id);
    leaderLayer.append('line')
      .attr('x1', c[0]).attr('y1', c[1]).attr('x2', lx).attr('y2', ly)
      .attr('stroke', '#1B2556').attr('stroke-width', 1).attr('stroke-dasharray', '3,3').attr('data-id', id);

    var div = document.createElement('div');
    div.className = 'label';
    div.dataset.id = id;
    div.style.left = lx + 'px';
    div.style.top = ly + 'px';
    div.style.pointerEvents = 'auto';
    div.innerHTML = '<span class="dot">' + info.flag + '</span>' + info.name;
    div.addEventListener('click', function(){ parent.postMessage({ type: 'countryClick', ...info }, '*'); });
    labelsEl.appendChild(div);

    var show = !(mode === 'risk' && info.level !== 'high');
    if (!show) { div.style.display = 'none'; leaderLayer.selectAll('[data-id="' + id + '"]').style('display', 'none'); }
  });

  // 한국 라벨 — 위험도 모드와 무관하게 항상 표시 (의존도 추적 대상이 아니라 위치 표시용)
  var krFeature = geo.features.filter(function(f){ return Number(f.id) === KOREA_ISO; })[0];
  if (krFeature) {
    var kc = path.centroid(krFeature);
    if (kc && !isNaN(kc[0]) && !isNaN(kc[1])) {
      var klx = Math.max(60, Math.min(size.w - 60, kc[0] + KOREA_OFFSET[0]));
      var kly = Math.max(20, Math.min(size.h - 20, kc[1] + KOREA_OFFSET[1]));
      leaderLayer.append('circle').attr('cx', kc[0]).attr('cy', kc[1]).attr('r', 3).attr('fill', '#1B2556').attr('data-id', 'kr');
      leaderLayer.append('line')
        .attr('x1', kc[0]).attr('y1', kc[1]).attr('x2', klx).attr('y2', kly)
        .attr('stroke', '#1B2556').attr('stroke-width', 1).attr('stroke-dasharray', '3,3').attr('data-id', 'kr');
      var krDiv = document.createElement('div');
      krDiv.className = 'label kr-label';
      krDiv.dataset.id = 'kr';
      krDiv.style.left = klx + 'px';
      krDiv.style.top = kly + 'px';
      krDiv.innerHTML = '<span class="dot">' + KOREA_LABEL.flag + '</span>' + KOREA_LABEL.name;
      labelsEl.appendChild(krDiv);
    }
  }

  if (window.twemoji) twemoji.parse(labelsEl, { folder: 'svg', ext: '.svg' });
}

function fitAndDraw() {
  if (!geoData) return;
  var size = getSize();
  svg.attr('viewBox', '0 0 ' + size.w + ' ' + size.h);
  projection.fitSize([size.w - 8, size.h - 8], geoData);
  svg.selectAll('path.country').attr('d', path);
  positionLabels(geoData, size);
}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')
  .then(function(r){ return r.json(); })
  .then(function(topo){
    geoData = topojson.feature(topo, topo.objects.countries);
    var sel = svg.selectAll('path').data(geoData.features);
    sel.enter().append('path')
      .attr('class', function(d){
        if (Number(d.id) === KOREA_ISO) return 'country kr';
        return getInfo(d.id) ? 'country dep' : 'country';
      })
      .attr('fill', function(d){ return fillFor(getInfo(d.id)); })
      .on('mousemove', function(event, d){
        var info = getInfo(d.id);
        if (!info) { tooltip.style.display = 'none'; return; }
        tooltip.style.display = 'block';
        tooltip.style.left = (event.offsetX + 14) + 'px';
        tooltip.style.top = (event.offsetY + 8) + 'px';
        tooltip.innerHTML = '<b>' + info.name + '</b> · 의존도 ' + info.dependency + '% · ' + info.minerals;
      })
      .on('mouseleave', function(){ tooltip.style.display = 'none'; })
      .on('click', function(event, d){
        var info = getInfo(d.id);
        if (!info) return;
        parent.postMessage({ type: 'countryClick', ...info }, '*');
      });
    fitAndDraw();
    // iframe이 뒤늦게 자리잡는 경우를 대비해 한 번 더 재보정(레이아웃이 이미 안정된 뒤라면
    // 값이 같아서 사실상 no-op).
    setTimeout(fitAndDraw, 300);
  });

window.addEventListener('resize', fitAndDraw);

window.addEventListener('message', function(e){
  if (e.data && e.data.type === 'setMode') {
    mode = e.data.mode;
    svg.selectAll('path').attr('fill', function(d){ return fillFor(getInfo(d.id)); });
    if (geoData) positionLabels(geoData, getSize());
  }
});
</script>
</body>
</html>
